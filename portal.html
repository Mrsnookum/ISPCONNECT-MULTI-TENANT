<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect | ISP Wi-Fi</title>

    <!-- MIKROTIK DATA INJECTION -->
    <script>
        window.mTikData = {
            mac: "$(mac)",
            ip: "$(ip)",
            identity: "$(identity)",
            linkLoginOnly: "$(link-login-only)",
            linkOrig: "$(link-orig)",
            error: "$(error)"
        };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #00B37E;
            --primary-dark: #00996B;
            --primary-soft: #ECFDF5;
            --accent-blue: #2563EB;
            --text-dark: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
            --bg: #F3F6FA;
            --card-bg: #FFFFFF;
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        body {
            background: var(--bg);
            color: var(--text-dark);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 16px 28px;
        }

        .portal-shell {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TOP BRAND BAR */
        .top-brand-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 0 14px;
        }

        .top-brand-name {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-dark);
        }

        /* HERO WELCOME */
        .portal-hero {
            text-align: center;
            padding: 4px 8px 20px;
            width: 100%;
        }

        .hero-wifi-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .portal-hero h1 {
            font-size: 1.42rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .portal-hero p {
            font-size: 0.84rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.45;
        }

        #mtik-error-display {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* MAIN WHITE CARD */
        .portal-card {
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
            overflow: hidden;
        }

        /* Accent bar preserves #portalLeftPanel hook for dynamic ISP brand color */
        .portal-accent-bar {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent-blue) 100%);
        }

        .portal-card-body {
            padding: 20px 18px 22px;
        }

        .section-heading {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        /* PACKAGE RADIO LIST */
        .package-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }

        .pkg-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            background: #FFFFFF;
            border: 1.5px solid var(--border);
            border-radius: 13px;
            padding: 14px 16px;
            cursor: pointer;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, transform 0.12s ease;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }

        .pkg-btn:active { transform: scale(0.99); }
        .pkg-btn:hover { border-color: #CBD5E1; background: #FAFCFF; }

        /* Radio Ring (Left) */
        .pkg-btn::before {
            content: '';
            width: 19px;
            height: 19px;
            border-radius: 50%;
            border: 2px solid #CBD5E1;
            background: #FFFFFF;
            flex-shrink: 0;
            order: 0;
            transition: all 0.18s ease;
        }

        .pkg-name {
            order: 1;
            margin-right: auto;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.25;
        }

        .pkg-price {
            order: 2;
            font-size: 0.94rem;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
        }

        .pkg-btn.selected {
            border-color: var(--accent-blue);
            background: #F8FBFF;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .pkg-btn.selected::before {
            border-color: var(--primary);
            border-width: 5px;
            box-shadow: 0 0 0 3px rgba(0, 179, 126, 0.16);
        }

        /* Corner Check Badge on Selected Package */
        .pkg-btn.selected::after {
            content: '✓';
            position: absolute;
            top: -7px;
            right: -7px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-blue);
            color: #FFFFFF;
            font-size: 0.7rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
        }

        /* M-PESA PAYMENT SECTION */
        .mpesa-section {
            padding-top: 2px;
            border-radius: 12px;
            transition: background 0.3s ease;
        }

        .mpesa-section.highlight-pulse {
            animation: focusPulse 0.75s ease;
        }

        @keyframes focusPulse {
            0% { background: rgba(0, 179, 126, 0.12); }
            100% { background: transparent; }
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .field-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .voucher-toggle-link {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .voucher-toggle-link:hover { text-decoration: underline; }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
            background: #FFFFFF;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .input-group input::placeholder {
            color: #94A3B8;
            font-weight: 500;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 179, 126, 0.14);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .btn {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.94rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.18s ease, transform 0.12s ease;
        }

        .btn:active { transform: scale(0.99); }

        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 6px 16px rgba(0, 179, 126, 0.25);
        }
        .btn-primary:hover { background: var(--primary-dark); }

        .btn-dark {
            background: var(--text-dark);
            color: #FFFFFF;
        }
        .btn-dark:hover { background: #1E293B; }

        /* COLLAPSIBLE VOUCHER / RECONNECT SECTION */
        .voucher-section {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
        }
        .voucher-section.open { display: block; }

        /* ISP SUPPORT STRIP (POPULATED FROM SAVED ISP SUPPORT PHONE) */
        .support-strip {
            display: none;
            margin-top: 16px;
            padding: 11px 13px;
            border-radius: 11px;
            background: #F8FAFC;
            border: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .support-strip.visible { display: flex; }

        .support-call-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--accent-blue);
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        .support-call-link:hover { text-decoration: underline; }

        /* LOCKED PLATFORM FOOTER */
        .platform-footer {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.76rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .platform-footer strong {
            color: var(--primary);
            font-weight: 700;
        }

        /* TOAST */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #0F172A;
            color: #FFFFFF;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.28s ease;
            z-index: 1000;
            max-width: calc(100vw - 32px);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #mtik-login-form { display: none; }

        @media (max-width: 440px) {
            body { padding: 12px 12px 24px; justify-content: flex-start; }
            .portal-card-body { padding: 18px 14px 20px; }
        }
    </style>
</head>
<body>

    <main class="portal-shell">
        <!-- TOP BRAND HEADER -->
        <header class="top-brand-bar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="wifiGradSm" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00B37E"/>
                        <stop offset="100%" stop-color="#0EA5E9"/>
                    </linearGradient>
                </defs>
                <path d="M5 12.55a11 11 0 0 1 14.08 0" stroke="url(#wifiGradSm)" stroke-width="2.4" stroke-linecap="round"/>
                <path d="M1.42 9a16 16 0 0 1 21.16 0" stroke="url(#wifiGradSm)" stroke-width="2.4" stroke-linecap="round"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" stroke="url(#wifiGradSm)" stroke-width="2.4" stroke-linecap="round"/>
                <circle cx="12" cy="20" r="1.5" fill="#00B37E"/>
            </svg>
            <span class="top-brand-name" id="portalBrandName">ISPConnect</span>
        </header>

        <!-- HERO WELCOME -->
        <section class="portal-hero">
            <div class="hero-wifi-badge">
                <svg width="46" height="36" viewBox="0 0 46 36" fill="none" aria-hidden="true">
                    <defs>
                        <linearGradient id="wifiGradLg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00C48C"/>
                            <stop offset="100%" stop-color="#0EA5E9"/>
                        </linearGradient>
                    </defs>
                    <path d="M4 13.5C14.5 3.5 31.5 3.5 42 13.5" stroke="url(#wifiGradLg)" stroke-width="4" stroke-linecap="round"/>
                    <path d="M10.5 20.2C17.4 13.7 28.6 13.7 35.5 20.2" stroke="url(#wifiGradLg)" stroke-width="4" stroke-linecap="round"/>
                    <path d="M17 26.8C20.3 23.8 25.7 23.8 29 26.8" stroke="url(#wifiGradLg)" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="23" cy="32.5" r="2.7" fill="#00B37E"/>
                </svg>
            </div>
            <h1 id="portalWelcomeTitle">Welcome to Wi-Fi</h1>
            <p id="portalWelcome">Fast • Secure • Reliable</p>
            <p id="mtik-error-display"></p>
        </section>

        <!-- MAIN PORTAL CARD -->
        <section class="portal-card">
            <div class="portal-accent-bar" id="portalLeftPanel"></div>

            <div class="portal-card-body">
                <!-- 1. PACKAGES -->
                <div class="section-heading">Choose Your Package</div>
                <div class="package-grid" id="packagesContainer">
                    <div style="text-align: center; color: var(--text-muted); font-size: 0.84rem; padding: 18px 0;">Loading packages...</div>
                </div>

                <!-- 2. M-PESA PAYMENT -->
                <div class="mpesa-section" id="mpesaSection">
                    <div class="section-heading" style="margin-bottom: 6px;">M-Pesa Payment</div>
                    <div class="label-row">
                        <label for="phoneInput" class="field-label">Enter your phone number</label>
                        <button type="button" class="voucher-toggle-link" id="toggleVoucherBtn">Voucher &rarr;</button>
                    </div>

                    <div class="input-group">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </span>
                        <input type="tel" id="phoneInput" placeholder="07XXXXXXXX" inputmode="tel" autocomplete="tel">
                    </div>

                    <button class="btn btn-primary" id="btnPay">Pay with M-Pesa</button>
                </div>

                <!-- 3. VOUCHER / RECONNECT (TOGGLED VIA "Voucher ->") -->
                <div class="voucher-section" id="voucherSection">
                    <div class="label-row" style="margin-bottom: 8px;">
                        <label for="voucherInput" class="field-label">Already have a code? Reconnect</label>
                    </div>
                    <div class="input-group">
                        <span class="input-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>
                            </svg>
                        </span>
                        <input type="text" id="voucherInput" placeholder="Enter Voucher or M-Pesa Code" style="text-transform: uppercase;">
                    </div>
                    <button class="btn btn-dark" id="btnConnect">Connect Device &rarr;</button>
                </div>

                <!-- 4. DYNAMIC ISP SUPPORT CONTACT -->
                <div class="support-strip" id="portalSupportBox">
                    <span>Need help connecting?</span>
                    <a href="#" class="support-call-link" id="portalSupportLink">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        <span id="portalSupportPhone"></span>
                    </a>
                </div>
            </div>
        </section>

        <!-- LOCKED PLATFORM FOOTER -->
        <footer class="platform-footer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Powered by <strong>ISPConnect</strong></span>
        </footer>
    </main>

    <!-- MIKROTIK HIDDEN FORM -->
    <form id="mtik-login-form" action="$(link-login-only)" method="post">
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
        <input type="text" name="username" id="mtik-user" />
        <input type="password" name="password" id="mtik-pass" />
    </form>

    <div class="toast" id="toastMsg"></div>

    <script src="portal.js"></script>
    <script src="guard.js"></script>
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        // Auto-move & focus into M-Pesa phone input when a package is selected
        (function () {
            const pkgContainer = document.getElementById('packagesContainer');
            const phoneInput = document.getElementById('phoneInput');
            const mpesaSection = document.getElementById('mpesaSection');
            const voucherSection = document.getElementById('voucherSection');
            const toggleVoucherBtn = document.getElementById('toggleVoucherBtn');

            if (toggleVoucherBtn && voucherSection) {
                toggleVoucherBtn.addEventListener('click', () => {
                    const isOpen = voucherSection.classList.toggle('open');
                    toggleVoucherBtn.innerHTML = isOpen ? 'Hide Voucher' : 'Voucher &rarr;';
                    if (isOpen) {
                        voucherSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        const vInput = document.getElementById('voucherInput');
                        if (vInput) vInput.focus({ preventScroll: true });
                    }
                });
            }

            if (pkgContainer && phoneInput) {
                pkgContainer.addEventListener('click', (e) => {
                    const pkgBtn = e.target.closest('.pkg-btn');
                    if (!pkgBtn) return;

                    if (voucherSection && voucherSection.classList.contains('open')) {
                        voucherSection.classList.remove('open');
                        if (toggleVoucherBtn) toggleVoucherBtn.innerHTML = 'Voucher &rarr;';
                    }

                    if (mpesaSection) {
                        mpesaSection.classList.remove('highlight-pulse');
                        void mpesaSection.offsetWidth;
                        mpesaSection.classList.add('highlight-pulse');
                        mpesaSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }

                    // Focus synchronously inside tap gesture so mobile keyboards open reliably
                    phoneInput.focus({ preventScroll: true });
                });
            }
        })();
    </script>
</body>
</html>
